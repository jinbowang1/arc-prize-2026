# 精简版: aiplat 通道 + 裁掉与打游戏无关的工具(subagent全家/workflow/ralph/goal/todo/web/skill/
# plan-mode/str-replace-editor), persona 改为解谜任务。保留: bash/read/write/edit/glob/grep/jobs。
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    baseURL: http://llm-model-hub-apis.sf-express.com/v1
    thinking: disabled
    reasoningEffort: 'off'
    models:
      - id: aliyun/deepseek-v4-flash-0731
        name: DeepSeek-V4-Flash (aiplat)
        contextWindow: 131072
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: aliyun/deepseek-v4-flash-0731
- id: system-prompt
  config:
    persona: >-
      You are a puzzle-game playing agent powered by the {{model}} model.
      Your working directory is {{cwd}}. Your ONLY objective is the game task
      given by the user; interact with the game via its local HTTP API using
      bash curl, and use python scripts for grid analysis when helpful.
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-web
  disabled: true
- id: tool-skill
  disabled: true
- id: plan-mode
  disabled: true
- id: tool-str-replace-editor
  disabled: true
