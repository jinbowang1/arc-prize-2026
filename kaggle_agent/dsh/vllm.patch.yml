# 赛场: dsh 的模型层指向 notebook 内 vLLM(OpenAI 兼容, served-model-name=local)
# maxTokens 必须显式给: dsh 默认 256000 会被 vLLM 按 max_model_len=32768 拒掉
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    baseURL: http://127.0.0.1:8000/v1
    maxTokens: 2000
    # vLLM 上的 Qwen 只认 xhigh/medium/low, dsh 默认 high 会被拒
    reasoningEffort: 'off'
    models:
      - id: local
        name: local vLLM
        contextWindow: 32768
        maxTokens: 2000
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: local
